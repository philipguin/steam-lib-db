name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Verify tag matches package
        run: python -c "import os, steam_library; assert os.environ['GITHUB_REF_NAME'] == 'v' + steam_library.__version__"
      - run: python -m pytest --cov=steam_library --cov-fail-under=90
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: docker build -t steam-lib-db:release .
      - run: docker run --rm steam-lib-db:release --version
      - name: Publish GitHub release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
